services:
  # Backend Node.js Service
  - type: web
    name: safezone-backend
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ML_SERVICE_URL
        value: https://safezone-ml-service.onrender.com
      - key: JWT_SECRET
        generateValue: true

  # Python ML Service
  - type: web
    name: safezone-ml-service
    plan: free
    env: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13

  # Note: DATABASE_URL and REDIS_URL must be provided manually in the Render Dashboard
  # since we are using external services (like Supabase and Upstash).
